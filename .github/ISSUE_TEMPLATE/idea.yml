name: I've had an idea
description: A thing the game should do, or a thing it should do differently. The best ones start with "wouldn't it be funny if...".
title: 'Idea: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Ooh, go on then. Pull up a chair.

        No idea is too small: a line a rival should say, a corner of a map that's too quiet, a menu that takes one key press too many. Big ones are welcome too, as long as you're happy for them to be argued with.

        (Before you ask: the music is staying off. The game's owner finds it annoying, and frankly it's their game.)
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      placeholder: Bill should haggle. Badly. And remember that you once sold him a Linen roll for a Fire Stone.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be better?
      description: What does it make more fun, more tense, or less annoying? If it fixes something that bugged you mid-raid, tell us what you were doing at the time.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the game is it about?
      options:
        - Raids (the clock, loot, exits, contracts)
        - The rivals who hunt you
        - Battles and Pokémon
        - The pack and the secure container
        - Home in the Harbour (Oak, Joy, Brock or Bill)
        - The maps
        - The map maker
        - Something else entirely
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots, a game that already does it well. All welcome.
    validations:
      required: false
