<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape from Pallet Town</title>
    <meta
      name="description"
      content="Kanto, but it's a heist. Five minutes on the clock, a pack full of loot and a rival on your tail: grab what you can and leg it. Free in your browser, on a laptop or desktop."
    />
    <!-- The tab and home-screen icons are the game's own Poke Ball, drawn by
         scripts/draw-site-icons.mjs; the SVG stays crisp at any size. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1f33" />
    <!-- What a shared link shows in WhatsApp, Discord, iMessage and the rest.
         They fetch the page without running it, so the picture must be a full
         address: the published copy of docs/readme/social-preview.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Escape from Pallet Town" />
    <meta property="og:title" content="Escape from Pallet Town" />
    <meta
      property="og:description"
      content="Kanto, but it's a heist. Grab the loot, beat the clock, leg it. Free in your browser, on a laptop or desktop."
    />
    <meta property="og:url" content="https://ollysalanson.github.io/escape-from-pallet-town-web/" />
    <meta property="og:image" content="https://ollysalanson.github.io/escape-from-pallet-town-web/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="ESCAPE FROM PALLET TOWN. Grab the loot. Beat the clock. Leg it. A trainer in a red cap runs through a pixel-art town with the raid clock at 0:09." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The game draws its text into a canvas, and canvas text never blocks on
         a font load: whatever is ready when a scene draws is what is painted,
         for good. Fetching the face with the document is half of the guarantee;
         BootScene waiting on it is the other half. -->
    <link
      rel="preload"
      href="./assets/battle/orange-kid.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The Pokedollar sign is its own face in the same family (style.css), and
         a face behind a unicode-range is not fetched until the sign is drawn. -->
    <link
      rel="preload"
      href="./assets/battle/pokedollar.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <!-- Said while the game's script is still on its way: on a slow line that
         is most of a minute, and an empty frame read as a broken page (break-it
         test, 23 Nov 2026). Mounting the game sweeps it away (gameLifecycle.ts). -->
    <div id="app"><p class="boot-wait" role="status">LOADING THE GAME…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
