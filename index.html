<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Everything the page shows before the game's own stylesheet has come,
         and if it never comes: kept here, because a page whose bundles are
         missing has nothing else to dress it. -->
    <style>
      @font-face {
        font-family: 'Orange Kid';
        src: url('./assets/battle/orange-kid.woff2') format('woff2');
        font-display: block;
      }
      body {
        margin: 0;
        background: #121011;
      }
      .boot-wait,
      .boot-failed p {
        margin: 0;
        font-family: 'Orange Kid', monospace;
        font-size: 32px;
        letter-spacing: 1px;
        color: #b9b1b4;
      }
      .boot-failed {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }
      .boot-failed button {
        font-family: 'Orange Kid', monospace;
        font-size: 28px;
        letter-spacing: 1px;
        color: #ffffff;
        background: #221d1e;
        border: 2px solid #2f9e46;
        padding: 6px 22px;
        cursor: pointer;
      }
    </style>
    <!-- A page from before a publish names bundles the publish deleted: GitHub
         Pages replaces the whole site, and a tab woken from the browser's cache
         after a night asleep asks for files that are gone (25 Nov 2026). If the
         game's own script or stylesheet fails while it is still loading, the
         page reloads once, which fetches the current page; a second failure
         within a minute - no connection, or files truly gone - stops and says
         so with a button, and tries again by itself when the connection comes
         back. It must stand before the build's script and stylesheet tags,
         which Vite puts at the end of this head. Asked by bootGuard.test.ts and
         played by tools/playtest/stalePage.mjs. -->
    <script>
      (function () {
        var KEY = 'escape-from-pallet-town.boot-reload';
        var RETRY_WINDOW_MS = 60000;
        var failed = false;
        var stillLoading = function () {
          return document.readyState === 'loading' || !!document.querySelector('.boot-wait');
        };
        var isGameFile = function (element) {
          if (element instanceof HTMLScriptElement) {
            return true;
          }
          return element instanceof HTMLLinkElement && /\b(stylesheet|modulepreload)\b/.test(element.rel);
        };
        var sayItFailed = function () {
          var wait = document.querySelector('.boot-wait');
          if (!wait) {
            document.addEventListener('DOMContentLoaded', sayItFailed, { once: true });
            return;
          }
          var box = document.createElement('div');
          box.className = 'boot-failed';
          box.setAttribute('role', 'alert');
          var line = document.createElement('p');
          line.textContent = 'THE GAME COULD NOT LOAD.';
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'TRY AGAIN';
          button.addEventListener('click', function () {
            location.reload();
          });
          box.append(line, button);
          wait.replaceWith(box);
          button.focus();
          window.addEventListener('online', function () {
            location.reload();
          }, { once: true });
        };
        window.addEventListener('error', function (event) {
          if (failed || !isGameFile(event.target) || !stillLoading()) {
            return;
          }
          failed = true;
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last > RETRY_WINDOW_MS) {
              sessionStorage.setItem(KEY, String(Date.now()));
              location.reload();
              return;
            }
          } catch (error) {
            // Storage refused: a reload could not know it had already tried.
          }
          sayItFailed();
        }, true);
      })();
    </script>
    <title>Escape from Pallet Town</title>
    <meta
      name="description"
      content="Kanto, but it's a heist. Five minutes on the clock, a pack full of loot and a rival on your tail: grab what you can and leg it. Free in your browser, on a phone, a laptop or a desktop."
    />
    <!-- The tab and home-screen icons are the game's own Poke Ball, drawn by
         scripts/draw-site-icons.mjs; the SVG stays crisp at any size. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#121011" />
    <!-- Added to a home screen, it opens as the game alone - no browser bars -
         on either phone: Android reads the manifest, iOS the three tags under it.
         The icons are drawn by the same script as the tab's. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pallet Town" />
    <!-- What a shared link shows in WhatsApp, Discord, iMessage and the rest.
         They fetch the page without running it, so the picture must be a full
         address: the published copy of docs/readme/social-preview.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Escape from Pallet Town" />
    <meta property="og:title" content="Escape from Pallet Town" />
    <meta
      property="og:description"
      content="Kanto, but it's a heist. Grab the loot, beat the clock, leg it. Free in your browser, on a phone, a laptop or a desktop."
    />
    <meta property="og:url" content="https://ollysalanson.github.io/escape-from-pallet-town-web/" />
    <meta property="og:image" content="https://ollysalanson.github.io/escape-from-pallet-town-web/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="ESCAPE FROM PALLET TOWN. Grab the loot. Beat the clock. Leg it. A trainer in a red cap runs through a pixel-art town with the raid clock at 0:09." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The game draws its text into a canvas, and canvas text never blocks on
         a font load: whatever is ready when a scene draws is what is painted,
         for good. Fetching the face with the document is half of the guarantee;
         BootScene waiting on it is the other half. -->
    <link
      rel="preload"
      href="./assets/battle/orange-kid.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The Pokedollar sign is its own face in the same family (style.css), and
         a face behind a unicode-range is not fetched until the sign is drawn. -->
    <link
      rel="preload"
      href="./assets/battle/pokedollar.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <!-- Said while the game's script is still on its way: on a slow line that
         is most of a minute, and an empty frame read as a broken page (break-it
         test, 23 Nov 2026). Mounting the game sweeps it away (gameLifecycle.ts). -->
    <div id="app"><p class="boot-wait" role="status">LOADING THE GAME…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
