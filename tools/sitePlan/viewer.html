<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Site Plan</title>
    <style>
      :root {
        --paper: #f1eadb;
        --paper-deep: #e6dcc6;
        --ink: #1f2430;
        --ink-soft: #5b6170;
        --line: rgba(31, 36, 48, 0.18);
        --card: #fffdf7;
        --accent: #e8590c;
        --focus: #ffd43b;
        --shadow: 0 6px 22px rgba(31, 36, 48, 0.18), 0 1px 3px rgba(31, 36, 48, 0.2);
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
      }
      #plan {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
        outline: none;
      }
      #plan.dragging {
        cursor: grabbing;
      }
      #plan.pointing {
        cursor: pointer;
      }
      .panel {
        position: fixed;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }

      /* Title block and search, top left. */
      #titleblock {
        top: 12px;
        left: 12px;
        width: 320px;
        padding: 12px 14px 12px;
        z-index: 3;
      }
      #titleblock h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.1;
        font-weight: 850;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #titleblock .sub {
        margin: 3px 0 10px;
        font-size: 12px;
        color: var(--ink-soft);
        letter-spacing: 0.02em;
      }
      #searchwrap {
        position: relative;
      }
      #search {
        width: 100%;
        font: inherit;
        font-size: 15px;
        padding: 8px 10px 8px 32px;
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }
      #search:focus {
        outline: 3px solid var(--focus);
        outline-offset: 0;
      }
      #searchwrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }
      #results {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        max-height: min(50vh, 380px);
        overflow-y: auto;
      }
      #results:empty {
        display: none;
      }
      #results li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      #results li[aria-selected='true'],
      #results li:hover {
        background: var(--paper);
      }
      #results .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .where {
        font-size: 12px;
        color: var(--ink-soft);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #results .none {
        color: var(--ink-soft);
        cursor: default;
      }

      /* Zoom buttons and north arrow, top right. */
      #controls {
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 3;
        background: none;
        border: 0;
        box-shadow: none;
      }
      #controls .north {
        width: 46px;
        height: 58px;
        display: block;
      }
      .zoombox {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .zoombox button {
        width: 42px;
        height: 40px;
        font: inherit;
        font-size: 22px;
        font-weight: 700;
        background: var(--card);
        color: var(--ink);
        border: 0;
        cursor: pointer;
      }
      .zoombox button + button {
        border-top: 1px solid var(--line);
      }
      .zoombox button:hover {
        background: var(--paper);
      }
      .zoombox button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: -3px;
      }
      .zoombox .fit {
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      /* The key, bottom right. */
      #key {
        right: 12px;
        bottom: 12px;
        width: 250px;
        max-height: calc(100vh - 210px);
        overflow-y: auto;
        padding: 10px 12px 12px;
        z-index: 2;
      }
      #key h2,
      #card h2 {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      #key h2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #keytoggle {
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 4px 2px 4px 10px;
        background: none;
        border: 0;
        color: var(--ink);
        cursor: pointer;
      }
      #key:not(.open) > :not(h2) {
        display: none;
      }
      #key:not(.open) h2 {
        margin: 0;
      }
      #key:not(.open) {
        width: auto;
        padding: 6px 10px;
      }
      #key label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        padding: 3px 0;
        cursor: pointer;
        user-select: none;
      }
      #key label .count {
        margin-left: auto;
        color: var(--ink-soft);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      #key input {
        margin: 0;
        accent-color: var(--ink);
      }
      #key canvas {
        width: 20px;
        height: 20px;
        flex: none;
      }
      #key .zones {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 2px 0 8px;
        font-size: 13px;
      }
      #key .zones span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #key .zones i {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 2px solid;
        display: inline-block;
      }
      #key hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 8px 0;
      }

      /* Scale bar and where the pointer is, bottom left. */
      #scale {
        left: 12px;
        bottom: 12px;
        padding: 8px 12px;
        z-index: 2;
        font-size: 12px;
        min-width: 200px;
      }
      #scale .bar {
        height: 8px;
        border: 1.5px solid var(--ink);
        border-top: 0;
        margin: 4px 0 2px;
        position: relative;
      }
      #scale .bar::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        height: 5px;
        border-left: 1.5px solid var(--ink);
      }
      #scale .ticks {
        display: flex;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
      }
      #where {
        margin-top: 6px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 300px;
      }

      /* What the pointer is over, and what was chosen. */
      #tip {
        position: fixed;
        z-index: 5;
        pointer-events: none;
        max-width: 300px;
        padding: 9px 11px;
        font-size: 13px;
        display: none;
      }
      #card {
        left: 12px;
        bottom: 96px;
        width: 320px;
        padding: 12px 14px;
        z-index: 4;
        display: none;
      }
      #card .close {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 30px;
        height: 30px;
        border: 0;
        background: none;
        font-size: 20px;
        cursor: pointer;
        color: var(--ink-soft);
        border-radius: 6px;
      }
      #card .close:hover {
        background: var(--paper);
        color: var(--ink);
      }
      #card .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      #card .actions button {
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        padding: 7px 12px;
        border-radius: 7px;
        border: 1.5px solid var(--ink);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      #card .actions button.primary {
        background: var(--ink);
        color: #fff;
      }
      #card .actions button:focus-visible {
        outline: 3px solid var(--focus);
      }
      .feat .kind {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .feat .kind canvas {
        width: 16px;
        height: 16px;
      }
      .feat .title {
        font-size: 16px;
        font-weight: 750;
        margin: 3px 0 2px;
        line-height: 1.2;
      }
      .feat .places {
        font-size: 12.5px;
        color: var(--ink-soft);
      }
      .feat .grid {
        display: inline-block;
        margin-top: 6px;
        font-size: 12px;
        font-weight: 700;
        padding: 1px 6px;
        border: 1.5px solid var(--ink);
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
      .feat ul {
        margin: 6px 0 0;
        padding-left: 16px;
        font-size: 13px;
        line-height: 1.35;
      }
      .feat .hint {
        margin-top: 6px;
        font-size: 11.5px;
        color: var(--ink-soft);
      }

      @media (max-width: 720px) {
        #titleblock {
          left: 8px;
          right: 64px;
          top: 8px;
          width: auto;
          padding: 8px 10px 10px;
        }
        #titleblock h1 {
          font-size: 16px;
        }
        #titleblock .sub {
          margin-bottom: 6px;
        }
        #controls {
          top: 8px;
          right: 8px;
        }
        #controls .north {
          width: 38px;
          height: 48px;
        }
        #key {
          right: 8px;
          bottom: 8px;
          width: auto;
          max-width: calc(100vw - 16px);
          max-height: 55vh;
          padding: 6px 10px;
        }
        #key.open {
          left: 8px;
        }
        #scale {
          left: 8px;
          bottom: 8px;
          min-width: 0;
          padding: 6px 10px;
        }
        #where {
          max-width: 52vw;
        }
        #card {
          left: 8px;
          right: 8px;
          bottom: 76px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="plan"
      tabindex="0"
      aria-label="Site plan. Drag to move, scroll or pinch to zoom."
    ></canvas>

    <header id="titleblock" class="panel">
      <h1 id="maptitle">Site plan</h1>
      <p class="sub" id="mapsub"></p>
      <div id="searchwrap">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="5" fill="none" stroke="#1f2430" stroke-width="2" />
          <path d="M10.5 10.5 15 15" stroke="#1f2430" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Find a place"
          autocomplete="off"
          spellcheck="false"
          aria-label="Find a place"
          aria-controls="results"
        />
      </div>
      <ul id="results" role="listbox"></ul>
    </header>

    <nav id="controls" class="panel" aria-label="Zoom">
      <svg class="north" viewBox="0 0 46 58" aria-label="North is up" role="img">
        <text
          x="23"
          y="13"
          text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-weight="800"
          font-size="13"
          fill="#1f2430"
        >
          N
        </text>
        <circle cx="23" cy="36" r="19" fill="#fffdf7" stroke="#1f2430" stroke-width="1.5" />
        <path d="M23 19 L30 42 L23 37 L16 42 Z" fill="#1f2430" />
        <path d="M23 19 L23 37 L16 42 Z" fill="#e8590c" />
      </svg>
      <div class="zoombox panel">
        <button id="zoomin" type="button" aria-label="Zoom in">+</button>
        <button id="zoomout" type="button" aria-label="Zoom out">&minus;</button>
        <button id="zoomfit" class="fit" type="button" aria-label="Show the whole plan">ALL</button>
      </div>
    </nav>

    <aside id="key" class="panel" aria-label="Key">
      <h2>
        <span>Key</span><button id="keytoggle" type="button" aria-expanded="false">SHOW ▴</button>
      </h2>
      <div class="zones" id="zones"></div>
      <div id="layers"></div>
    </aside>

    <div id="scale" class="panel" aria-live="off">
      <div class="ticks">
        <span>0</span><span id="scalehalf"></span><span id="scalefull"></span>
      </div>
      <div class="bar" id="scalebar"></div>
      <div id="where" style="display: none"></div>
    </div>

    <div id="tip" class="panel feat" role="tooltip"></div>
    <section id="card" class="panel feat" aria-live="polite"></section>

    <script>
      'use strict';
      const PLAN = /*__PLAN__*/ null;

      // ---------------------------------------------------------------- what is drawn
      const T = PLAN.tileSize;
      const QUARTER_COLOURS = ['#2b8a3e', '#1864ab', '#862e9c', '#c92a2a', '#e67700'];
      const FAR_COLOUR = '#495057';
      const KINDS = {
        exit: { label: 'Way out', colour: '#e03131', from: 0, labelFrom: 1.6 },
        landing: { label: 'Landing (raid start)', colour: '#1971c2', from: 0, labelFrom: 1.6 },
        boss: { label: 'Gym leader or keeper', colour: '#f08c00', from: 0, labelFrom: 2.5 },
        gate: { label: 'Barred way', colour: '#343a40', from: 1.2, labelFrom: 5 },
        center: { label: 'Pokémon Center', colour: '#e03131', from: 0.9, labelFrom: 3 },
        shop: { label: 'Shop', colour: '#1c7ed6', from: 0.9, labelFrom: 3 },
        gym: { label: 'Gym', colour: '#7048e8', from: 0.9, labelFrom: 3 },
        landmark: { label: 'Landmark', colour: '#f59f00', from: 2.2, labelFrom: 7 },
        building: { label: 'Building', colour: '#8d5a2b', from: 3.5, labelFrom: 5 },
        door: { label: 'Door, stairs or cave mouth', colour: '#8d5a2b', from: 5, labelFrom: 99 },
        trainer: { label: 'Trainer', colour: '#d9480f', from: 4, labelFrom: 12 },
        boat: { label: 'Boat or lift', colour: '#0c8599', from: 1.5, labelFrom: 5 },
        berry: { label: 'Berry tree', colour: '#c2255c', from: 5, labelFrom: 16 },
        sign: { label: 'Sign', colour: '#868e96', from: 7, labelFrom: 18 },
      };
      const ROOM_SORTS = new Set(['center', 'shop', 'gym']);
      /** The key row a feature is shown under. */
      function layerOf(f) {
        if ((f.kind === 'building' || f.kind === 'room') && ROOM_SORTS.has(f.sort)) return f.sort;
        if (f.kind === 'room') return 'building';
        return f.kind;
      }
      const KIND_WORDS = {
        quarter: 'Quarter',
        district: 'Place',
        room: 'Inside',
        building: 'Building',
        door: 'Door',
        exit: 'Way out',
        landing: 'Landing',
        gate: 'Barred way',
        landmark: 'Landmark',
        boss: 'Boss',
        trainer: 'Trainer',
        sign: 'Sign',
        berry: 'Berry tree',
        boat: 'Boat',
      };
      function kindWord(f) {
        if (f.sort === 'center') return 'Pokémon Center';
        if (f.sort === 'shop') return 'Shop';
        if (f.sort === 'gym') return 'Gym';
        if (f.sort === 'cave' && f.kind !== 'door') return 'Cave';
        if (f.sort === 'stairs') return 'Stairs';
        if (f.sort === 'lift') return 'Lift';
        if (f.kind === 'district' && f.depth === 0) return 'District';
        return KIND_WORDS[f.kind] || f.kind;
      }
      function colourOf(f) {
        if (f.kind === 'district' || f.kind === 'quarter')
          return f.quarter !== undefined ? QUARTER_COLOURS[f.quarter] : FAR_COLOUR;
        if (f.kind === 'room' && !ROOM_SORTS.has(f.sort))
          return f.quarter !== undefined ? QUARTER_COLOURS[f.quarter] : FAR_COLOUR;
        return KINDS[layerOf(f)].colour;
      }

      const features = PLAN.features;
      features.forEach((f, i) => {
        f.index = i;
        const r = f.rects[0];
        let best = r;
        for (const rect of f.rects) if (rect.w * rect.h > best.w * best.h) best = rect;
        f.box = boundsOf(f.rects);
        f.main = best;
        f.cx = best.x + best.w / 2;
        f.cy = best.y + best.h / 2;
        f.layer = layerOf(f);
        f.areaSize = f.rects.reduce((sum, rect) => sum + rect.w * rect.h, 0);
        f.search = fold(f.name);
      });
      function boundsOf(rects) {
        const x0 = Math.min(...rects.map((r) => r.x)),
          y0 = Math.min(...rects.map((r) => r.y));
        const x1 = Math.max(...rects.map((r) => r.x + r.w)),
          y1 = Math.max(...rects.map((r) => r.y + r.h));
        return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
      }
      function fold(text) {
        return text.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();
      }
      const MARKER_KINDS = new Set([
        'exit',
        'landing',
        'boss',
        'gate',
        'landmark',
        'trainer',
        'boat',
        'berry',
        'sign',
        'door',
      ]);
      const markers = features.filter(
        (f) => MARKER_KINDS.has(f.kind) || (f.kind === 'building' && ROOM_SORTS.has(f.sort)),
      );
      const buildings = features.filter((f) => f.kind === 'building');
      const rooms = features.filter((f) => f.kind === 'room');
      const districts = features
        .filter((f) => f.kind === 'district')
        .sort((a, b) => a.areaSize - b.areaSize);
      const quarters = features.filter((f) => f.kind === 'quarter');
      const gates = features.filter((f) => f.kind === 'gate');
      const boats = features.filter((f) => f.path);

      /** The outline of a union of rectangles, as merged straight edges. */
      function outlineOf(rects) {
        const key = (x, y) => x + ',' + y;
        const cells = new Set();
        for (const r of rects)
          for (let y = r.y; y < r.y + r.h; y++)
            for (let x = r.x; x < r.x + r.w; x++) cells.add(key(x, y));
        const horizontal = new Map(); // y -> sorted xs with an edge from x to x+1
        const vertical = new Map();
        const add = (map, at, from) => {
          if (!map.has(at)) map.set(at, []);
          map.get(at).push(from);
        };
        for (const r of rects)
          for (let y = r.y; y < r.y + r.h; y++)
            for (let x = r.x; x < r.x + r.w; x++) {
              if (!cells.has(key(x, y - 1))) add(horizontal, y, x);
              if (!cells.has(key(x, y + 1))) add(horizontal, y + 1, x);
              if (!cells.has(key(x - 1, y))) add(vertical, x, y);
              if (!cells.has(key(x + 1, y))) add(vertical, x + 1, y);
            }
        const segments = [];
        const merge = (map, flip) => {
          for (const [at, list] of map) {
            const sorted = [...new Set(list)].sort((a, b) => a - b);
            let start = sorted[0],
              end = sorted[0] + 1;
            for (let i = 1; i <= sorted.length; i++) {
              if (i < sorted.length && sorted[i] === end) {
                end++;
                continue;
              }
              segments.push(flip ? [at, start, at, end] : [start, at, end, at]);
              if (i < sorted.length) {
                start = sorted[i];
                end = start + 1;
              }
            }
          }
        };
        merge(horizontal, false);
        merge(vertical, true);
        return segments;
      }
      for (const f of [...districts, ...quarters])
        f.outline = f.rects.length > 1 ? outlineOf(f.rects) : null;

      // ---------------------------------------------------------------- the view
      const canvas = document.getElementById('plan');
      const ctx = canvas.getContext('2d');
      let W = 0,
        H = 0,
        DPR = 1;
      const view = { x: PLAN.width / 2, y: PLAN.height / 2, s: 1 };
      const visible = Object.fromEntries(Object.keys(KINDS).map((k) => [k, true]));
      const show = { grid: true, names: true, zones: true };
      let hovered = null,
        selected = null,
        flash = null;
      const MAX_SCALE = T * 48;
      /** The part of the window the panels leave clear: beside the title block, or under it, whichever is bigger. */
      function clearArea() {
        if (W < 720) return { x: 8, y: 150, w: W - 16, h: H - 150 - 70 };
        const title = document.getElementById('titleblock').getBoundingClientRect();
        const key = document.getElementById('key').getBoundingClientRect();
        const keyOpen = document.getElementById('key').classList.contains('open');
        const right = W - (keyOpen ? key.width + 24 : 70);
        const beside = { x: title.right + 16, y: 16, w: right - title.right - 16, h: H - 32 };
        const under = { x: 16, y: title.bottom + 16, w: right - 16, h: H - title.bottom - 16 - 64 };
        return scaleFor(beside) >= scaleFor(under) ? beside : under;
      }
      function scaleFor(area) {
        // Room for the rulers on the left and above, and the interiors heading.
        return Math.min((area.w - 30) / (PLAN.width + 2), (area.h - 40) / (PLAN.height + 2));
      }
      function fitScale() {
        return scaleFor(clearArea());
      }
      let fitted = 1;
      function minScale() {
        return fitted * 0.6;
      }
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2.5);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        fitted = fitScale();
        dirty();
      }
      const sx = (x) => (x - view.x) * view.s + W / 2;
      const sy = (y) => (y - view.y) * view.s + H / 2;
      const px = (screenX) => (screenX - W / 2) / view.s + view.x;
      const py = (screenY) => (screenY - H / 2) / view.s + view.y;
      function clampView() {
        view.s = Math.max(minScale(), Math.min(MAX_SCALE, view.s));

          return;
        }
        if (drag) {
          const dx = event.clientX - drag.x,
            dy = event.clientY - drag.y;
          if (!drag.moved && Math.hypot(dx, dy) > (drag.type === 'touch' ? 8 : 4)) {
            drag.moved = true;
            canvas.classList.add('dragging');
            showTip(null);
          }
          if (drag.moved) {
            view.x = drag.vx - dx / view.s;
            view.y = drag.vy - dy / view.s;
            clampView();
            saveHash();
            dirty();
            return;
          }
        }
        if (event.pointerType !== 'touch') hover(event.clientX, event.clientY);
      });
      function hover(x, y) {
        const f = featureAt(x, y);
        if (f !== hovered) {
          hovered = f;
          dirty();
        }
        canvas.classList.toggle('pointing', !!f);
        showTip(f, x, y);
        const tx = px(x),
          ty = py(y);
        const o = PLAN.outdoors;
        const where = document.getElementById('where');
        const inOutdoors = tx >= 0 && ty >= 0 && tx < o.w && ty < o.h;
        const place = placeOf(tx, ty);
        if (inOutdoors)
          where.textContent = `${letter(Math.floor(tx / PLAN.gridCell))}${Math.floor(ty / PLAN.gridCell) + 1} · tile ${Math.floor(tx)}, ${Math.floor(ty)}${place ? ' · ' + place : ''}`;
        else where.textContent = place ? `Inside · ${place}` : '';
        where.style.display = where.textContent ? '' : 'none';
      }
      function release(event) {
        const wasDrag = drag && drag.moved;
        const wasTap = drag && !drag.moved && pointers.size === 1;
        pointers.delete(event.pointerId);
        if (pointers.size < 2) pinch = null;
        if (pointers.size === 1) {
          const [p] = [...pointers.values()];
          drag = { x: p.x, y: p.y, vx: view.x, vy: view.y, moved: true, type: event.pointerType };
          return;
        }
        canvas.classList.remove('dragging');
        drag = null;
        if (wasTap && !wasDrag) {
          const f = featureAt(event.clientX, event.clientY);
          if (event.pointerType === 'touch') {
            select(f);
            return;
          }
          if (!f) {
            select(null);
            return;
          }
          const framed = selected === f;
          select(f);
          if (framed && f.goto) flyTo(f.goto, 'go');
          else if (f.goto && (f.kind === 'door' || f.kind === 'boat')) flyTo(f.goto, 'go');
          else flyToFeature(f);
          showTip(null);
        }
      }
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);
      canvas.addEventListener('pointerleave', (event) => {
        if (!pointers.size && event.pointerType !== 'touch') {
          hovered = null;
          showTip(null);
          dirty();
        }
      });
      canvas.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault();
          const unit = event.deltaMode === 1 ? 33 : event.deltaMode === 2 ? 400 : 1;
          const delta = event.deltaY * unit;
          // A pinch on a trackpad comes as a wheel with the control key held.
          const factor = Math.exp(-delta * (event.ctrlKey ? 0.012 : 0.0022));
          if (Math.abs(delta) < 40 && !event.ctrlKey && event.deltaMode === 0) {
            motion = null;
            zoomAbout(event.clientX, event.clientY, view.s * factor);
            clampView();
            saveHash();
            dirty();
          } else wheelZoom(event.clientX, event.clientY, factor);
          if (lastPointer) setTimeout(() => lastPointer && hover(lastPointer.x, lastPointer.y), 0);
        },
        { passive: false },
      );
      canvas.addEventListener('dblclick', (event) => {
        event.preventDefault();
        wheelZoom(event.clientX, event.clientY, 2.5);
      });
      window.addEventListener('keydown', (event) => {
        if (event.target === search) return;
        const step = 80 / view.s;
        if (event.key === '/') {
          event.preventDefault();
          search.focus();
          return;
        }
        if (event.key === '+' || event.key === '=') wheelZoom(W / 2, H / 2, 1.8);
        else if (event.key === '-' || event.key === '_') wheelZoom(W / 2, H / 2, 1 / 1.8);
        else if (event.key === '0') fit(true);
        else if (event.key === 'ArrowLeft') view.x -= step;
        else if (event.key === 'ArrowRight') view.x += step;
        else if (event.key === 'ArrowUp') view.y -= step;
        else if (event.key === 'ArrowDown') view.y += step;
        else if (event.key === 'Escape') select(null);
        else return;
        clampView();
        saveHash();
        dirty();
      });
      document.getElementById('zoomin').onclick = () => wheelZoom(W / 2, H / 2, 2);
      document.getElementById('zoomout').onclick = () => wheelZoom(W / 2, H / 2, 0.5);
      document.getElementById('zoomfit').onclick = () => fit(true);
      function fit(animated) {
        const area = clearArea();
        const s = scaleFor(area);
        // The plan's middle at the middle of the clear area, nudged right and down for the rulers.
        const cx = PLAN.width / 2 - (area.x + area.w / 2 - W / 2 + 12) / s;
        const cy = PLAN.height / 2 - (area.y + area.h / 2 - H / 2 + 16) / s;
        if (animated) {
          const path = interpolateZoom([view.x, view.y, viewWidth()], [cx, cy, W / s]);
          motion = { kind: 'fly', start: performance.now(), path };
          dirty();
          return;
        }
        view.s = s;
        view.x = cx;
        view.y = cy;
      }
      window.addEventListener('resize', () => {
        resize();
        clampView();
      });

      // ---------------------------------------------------------------- search
      const search = document.getElementById('search');
      const results = document.getElementById('results');
      let found = [],
        cursor = 0;
      /** How much a match matters: places and the buildings people head for first, a sign's words last. */
      function importance(f) {
        if (f.kind === 'district' || f.kind === 'quarter') return 0;
        if (f.kind === 'building' && f.goto) return ROOM_SORTS.has(f.sort) ? 0 : 1;
        if (f.kind === 'room') return ROOM_SORTS.has(f.sort) ? 1 : 2;
        if (f.kind === 'exit' || f.kind === 'landing' || f.kind === 'boss') return 1;
        if (f.kind === 'gate' || f.kind === 'landmark' || f.kind === 'boat') return 2;
        if (f.kind === 'trainer') return 3;
        if (f.kind === 'building') return 4;
        return { door: 5, sign: 6, berry: 7 }[f.kind] ?? 5;
      }
      function runSearch() {
        const q = fold(search.value.trim());
        if (!q) {
          found = [];
          results.innerHTML = '';
          return;
        }
        const seen = new Set();
        found = features
          .filter((f) => f.search.includes(q))
          .map((f) => ({
            f,
            score:
              importance(f) * 3 + (f.search.startsWith(q) ? 0 : f.search.includes(' ' + q) ? 1 : 2),
          }))
          .sort((a, b) => a.score - b.score || a.f.name.length - b.f.name.length)
          .map(({ f }) => f)
          .filter((f) => {
            const k = f.name + '|' + kindWord(f);
            if (seen.has(k)) return false;
            seen.add(k);
            return true;
          })
          .slice(0, 14);
        cursor = 0;
        renderResults();
      }
      function renderResults() {
        if (!found.length) {
          results.innerHTML = '<li class="none">Nothing on the plan is called that.</li>';
          return;
        }
        results.innerHTML = found
          .map(
            (f, i) =>
              `<li role="option" aria-selected="${i === cursor}" data-i="${f.index}"><span class="ic" data-i="${f.index}"></span><span class="name">${escapeHtml(f.name)}</span><span class="where">${escapeHtml(kindWord(f))}${f.grid && !f.grid.startsWith('Inside') ? ' · ' + escapeHtml(f.grid) : ''}</span></li>`,
          )
          .join('');
        for (const span of results.querySelectorAll('.ic')) {
          const f = features[Number(span.dataset.i)];
          const c =
            isMarker(f) || f.kind === 'building' || f.kind === 'room'
              ? iconCanvas(
                  f.kind === 'room' && !ROOM_SORTS.has(f.sort) ? { layer: 'building' } : f,
                  18,
                )
              : swatch(colourOf(f));
          span.replaceWith(c);
        }
        for (const li of results.querySelectorAll('li[data-i]'))
          li.onclick = () => choose(features[Number(li.dataset.i)]);
      }
      function swatch(colour) {
        const c = document.createElement('canvas');
        c.width = c.height = 36;
        c.style.width = c.style.height = '18px';
        const g = c.getContext('2d');
        g.fillStyle = colour + '33';
        g.strokeStyle = colour;
        g.lineWidth = 4;
        g.fillRect(5, 5, 26, 26);
        g.strokeRect(5, 5, 26, 26);
        return c;
      }
      function choose(f) {
        results.innerHTML = '';
        search.blur();
        select(f, { fly: true });
      }
      search.addEventListener('input', runSearch);
      search.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown') {
          cursor = Math.min(found.length - 1, cursor + 1);
          renderResults();
          event.preventDefault();
        } else if (event.key === 'ArrowUp') {
          cursor = Math.max(0, cursor - 1);
          renderResults();
          event.preventDefault();
        } else if (event.key === 'Enter' && found[cursor]) choose(found[cursor]);
        else if (event.key === 'Escape') {
          search.value = '';
          runSearch();
          search.blur();
          canvas.focus();
        }
      });
      search.addEventListener('focus', () => {
        if (search.value) runSearch();
      });

      // ---------------------------------------------------------------- the key
      function buildKey() {
        const zones = document.getElementById('zones');
        zones.innerHTML =
          PLAN.quarters
            .map(
              (name, i) =>
                `<span><i style="border-color:${QUARTER_COLOURS[i]};background:${QUARTER_COLOURS[i]}33"></i>${escapeHtml(name)}</span>`,
            )
            .join('') +
          `<span><i style="border-color:${FAR_COLOUR};background:${FAR_COLOUR}22"></i>Far places</span>`;
        const layers = document.getElementById('layers');
        const counts = {};
        for (const f of features)
          if (KINDS[f.layer] && (isMarker(f) || f.kind === 'building'))
            counts[f.layer] = (counts[f.layer] || 0) + 1;
        const rows = Object.keys(KINDS).filter((k) => counts[k]);
        layers.innerHTML =
          rows
            .map(
              (k) =>
                `<label><input type="checkbox" data-k="${k}" checked><span class="sw" data-k="${k}"></span>${escapeHtml(KINDS[k].label)}<span class="count">${counts[k]}</span></label>`,
            )
            .join('') +
          '<hr>' +
          '<label><input type="checkbox" data-show="grid" checked>Grid</label>' +
          '<label><input type="checkbox" data-show="zones" checked>Quarters and places</label>' +
          '<label><input type="checkbox" data-show="names" checked>Names</label>';
        for (const span of layers.querySelectorAll('.sw'))
          span.replaceWith(iconCanvas({ layer: span.dataset.k, sort: '' }, 20));
        for (const input of layers.querySelectorAll('input')) {
          input.onchange = () => {
            if (input.dataset.k) visible[input.dataset.k] = input.checked;
            else show[input.dataset.show] = input.checked;
            dirty();
          };
        }
        const key = document.getElementById('key');
        const toggle = document.getElementById('keytoggle');
        const set = (open) => {
          key.classList.toggle('open', open);
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'HIDE ▾' : 'SHOW ▴';
        };
        toggle.onclick = () => set(!key.classList.contains('open'));
        // Open from the start where there is room for it beside the whole plan.
        set(window.innerWidth >= 1400 && window.innerHeight >= 860);
      }

      // ---------------------------------------------------------------- where the view was
      let hashTimer = 0;
      function saveHash() {
        clearTimeout(hashTimer);
        hashTimer = setTimeout(() => {
          const value = `#${view.x.toFixed(1)},${view.y.toFixed(1)},${view.s.toFixed(3)}`;
          try {
            history.replaceState(null, '', value);
          } catch {
            /* a page opened from disk may refuse; the view still works */
          }
        }, 250);
      }
      function loadHash() {
        const parts = location.hash.slice(1).split(',').map(Number);
        if (parts.length === 3 && parts.every(Number.isFinite)) {
          [view.x, view.y, view.s] = parts;
          return true;
        }
        return false;
      }

      // ---------------------------------------------------------------- start
      document.title = `${PLAN.title} site plan`;
      document.getElementById('maptitle').textContent = PLAN.title;
      document.getElementById('mapsub').textContent =
        `Site plan · Escape from Pallet Town · ${PLAN.outdoors.w} × ${PLAN.outdoors.h} tiles, ${PLAN.gridCell} to a square · drawn ${PLAN.made}`;
      buildKey();
      resize();
      if (!loadHash()) fit(false);
      clampView();
      // The whole world first, so nothing is ever blank.
      for (let z = LEVELS.length - 1; z >= Math.max(0, LEVELS.length - 3); z--)
        for (let r = 0; r < LEVELS[z].rows; r++)
          for (let c = 0; c < LEVELS[z].columns; c++) pieceImage(z, c, r);
      dirty();
      window.__sitePlan = { view, features, select, flyTo, dirty, fit };
    </script>
  </body>
</html>
