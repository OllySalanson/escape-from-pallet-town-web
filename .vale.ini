# Vale over the game's own words: the contents of string literals in the
# TypeScript, never the code or its comments (styles/config/views/Strings.yml).
# Run by hand with `npm run vale`; see tools/vale/README.md. Every alert is a
# question for a person, never a fix to apply blind: character voice is the point.
StylesPath = styles
MinAlertLevel = suggestion
Grammars = typescript

[*.ts]
BasedOnStyles = Tells
View = Strings

# The characters a map's words may hold, the em dash among them: a list, not prose.
[src/game/world/mapText.ts]
Tells.EmDash = NO
